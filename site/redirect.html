<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Открыть в Hiddify — NEURON VPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* Страница редиректора — минимальный layout */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .redirect-bg {
      position: fixed; inset: 0;
      background-image: url('./media/bg-city-poster.webp');
      background-size: cover;
      background-position: center;
      z-index: -2;
    }
    .redirect-overlay {
      position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(4,8,20,.35), rgba(4,8,20,.75));
    }
    .redirect-card {
      max-width: 440px;
      width: 100%;
      background: rgba(8,12,22,.55);
      border: 1px solid rgba(235,232,224,.55);
      border-radius: 18px;
      box-shadow: 0 0 32px rgba(202,166,78,.20), inset 0 0 20px rgba(240,234,210,.05);
      padding: 26px 22px;
      text-align: center;
      backdrop-filter: blur(6px);
    }
    .redirect-card h1 {
      font-family: 'Marcellus', serif;
      letter-spacing: .12em;
      font-size: 22px;
      margin: 0 0 8px;
      background: linear-gradient(180deg, #fff6d8, #caa64e 55%, #8a6a2a);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      text-shadow: 0 0 22px rgba(202,166,78,.25);
    }
    .redirect-card p {
      color: #cfd9ea;
      font-size: 13px;
      margin: 0 0 20px;
      text-shadow: 0 1px 6px rgba(0,0,0,.75);
    }
    .big-import-btn {
      display: block;
      width: 100%;
      font-family: 'Marcellus', serif;
      font-size: 18px;
      letter-spacing: .10em;
      padding: 18px 14px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      color: #f5e3b0;
      background: linear-gradient(180deg, #3a3325, #151209 60%, #000);
      border: 1px solid #caa64e;
      text-shadow: 0 0 10px rgba(255,220,140,.55);
      box-shadow: 0 0 22px rgba(202,166,78,.35);
      transition: box-shadow .2s ease, transform .12s ease;
    }
    .big-import-btn:hover {
      box-shadow: 0 0 32px rgba(202,166,78,.6);
      transform: translateY(-1px);
    }
    .big-import-btn:active { transform: translateY(1px); }
    .hint { color: #c3d4ea; font-size: 12px; margin-top: 16px; }
    .hint a { color: #caa64e; }
    .icon { font-size: 42px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="redirect-bg"></div>
  <div class="redirect-overlay"></div>

  <div class="redirect-card">
    <div class="icon">🚀</div>
    <h1>NEURON VPN</h1>
    <p>Нажми на кнопку ниже, чтобы открыть Hiddify и импортировать конфиг</p>

    <a id="hiddify-link" class="big-import-btn" href="#">
      📲 ОТКРЫТЬ В HIDDIFY
    </a>

    <p class="hint">
      Hiddify не установлен?<br>
      <a href="https://github.com/hiddify/hiddify-next/releases/latest" target="_blank" rel="noopener">Скачать Hiddify ↗</a>
    </p>
  </div>

  <script>
    // Достаём ссылку из URL: ?to=hiddify://import/...
    (function () {
      const params = new URLSearchParams(location.search);
      const to = params.get('to');

      const link = document.getElementById('hiddify-link');
      if (!to) {
        link.textContent = '❌ Ссылка потерялась';
        link.href = '#';
        link.style.opacity = '.5';
        link.style.pointerEvents = 'none';
        return;
      }

      link.href = to;

      // Пытаемся автоматически перейти через 300 мс.
      // Если браузер заблокирует — юзер всё равно увидит кнопку и сможет нажать вручную.
      setTimeout(() => {
        try { location.href = to; } catch (e) {}
      }, 300);
    })();
  </script>
</body>
</html>
