# ═══════════════════════════════════════════════════════════════
# NEURON VPN — Nginx-конфиг
# ═══════════════════════════════════════════════════════════════

# ── HTTP → HTTPS редирект ──
server {
    listen 80;
    server_name neuron1.dpdns.org www.neuron1.dpdns.org;
    return 301 https://$host$request_uri;
}

# ── Основной HTTPS-сервер ──
server {
    listen 443 ssl http2;
    server_name neuron1.dpdns.org www.neuron1.dpdns.org;

    ssl_certificate /etc/ssl/neuron/fullchain.pem;
    ssl_certificate_key /etc/ssl/neuron/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ─────────────────────────────────────────────────────────
    # 1. НАШ API (Node.js на localhost:3000)
    #    /api/register, /api/login, /api/get-vpn-config и т.д.
    # ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─────────────────────────────────────────────────────────
    # 2. WebSocket для VLESS (Marzban Xray на 2087)
    # ─────────────────────────────────────────────────────────
    location /ws-5f847e4871c4f2cb {
        if ($http_upgrade != "websocket") {
            return 404;
        }
        proxy_redirect off;
        proxy_pass http://127.0.0.1:2087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─────────────────────────────────────────────────────────
    # 3. Подписки Marzban (/sub/...)
    # ─────────────────────────────────────────────────────────
    location /sub/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─────────────────────────────────────────────────────────
    # 4. Панель Marzban (/dashboard/ и её статика)
    # ─────────────────────────────────────────────────────────
    location ~ ^/(dashboard|static|docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─────────────────────────────────────────────────────────
    # 5. Marzban API для панели (на /panel-api/ — чтобы не мешать нашему /api/)
    # ─────────────────────────────────────────────────────────
    location /panel-api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─────────────────────────────────────────────────────────
    # 6. Статический сайт (HTML/CSS/JS/медиа)
    # ─────────────────────────────────────────────────────────
    location / {
        root /var/www/neuron/site;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Кэш для статики
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|mp4|mp3|woff2?)$ {
            root /var/www/neuron/site;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }
    }
}
